<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img" aria-labelledby="title desc"><title id="title">一个卷积核，滑过四个窗口</title><desc id="desc">输入3乘3，核2乘2，不翻转权重；彩色格标出左上窗口以及它产生的输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">一个卷积核，滑过四个窗口</text><text x="30" y="87" font-size="20" fill="#172b4d" text-anchor="start">输入 X</text><rect x="30" y="105" width="50" height="50" rx="5" fill="#bbf7d0" stroke="#94a3b8"/><text x="55" y="137" font-size="22" fill="#172b4d" text-anchor="middle">1</text><rect x="84" y="105" width="50" height="50" rx="5" fill="#bbf7d0" stroke="#94a3b8"/><text x="109" y="137" font-size="22" fill="#172b4d" text-anchor="middle">2</text><rect x="138" y="105" width="50" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="163" y="137" font-size="22" fill="#172b4d" text-anchor="middle">0</text><rect x="30" y="159" width="50" height="50" rx="5" fill="#bbf7d0" stroke="#94a3b8"/><text x="55" y="191" font-size="22" fill="#172b4d" text-anchor="middle">0</text><rect x="84" y="159" width="50" height="50" rx="5" fill="#bbf7d0" stroke="#94a3b8"/><text x="109" y="191" font-size="22" fill="#172b4d" text-anchor="middle">1</text><rect x="138" y="159" width="50" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="163" y="191" font-size="22" fill="#172b4d" text-anchor="middle">3</text><rect x="30" y="213" width="50" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="55" y="245" font-size="22" fill="#172b4d" text-anchor="middle">2</text><rect x="84" y="213" width="50" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="109" y="245" font-size="22" fill="#172b4d" text-anchor="middle">1</text><rect x="138" y="213" width="50" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="163" y="245" font-size="22" fill="#172b4d" text-anchor="middle">0</text><text x="290" y="87" font-size="20" fill="#172b4d" text-anchor="start">共享的 K</text><rect x="290" y="105" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="315" y="137" font-size="22" fill="#172b4d" text-anchor="middle">1</text><rect x="344" y="105" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="369" y="137" font-size="22" fill="#172b4d" text-anchor="middle">0</text><rect x="290" y="159" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="315" y="191" font-size="22" fill="#172b4d" text-anchor="middle">0</text><rect x="344" y="159" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="369" y="191" font-size="22" fill="#172b4d" text-anchor="middle">−1</text><text x="620" y="87" font-size="20" fill="#172b4d" text-anchor="start">输出 Y</text><rect x="620" y="105" width="50" height="50" rx="5" fill="#bbf7d0" stroke="#94a3b8"/><text x="645" y="137" font-size="22" fill="#172b4d" text-anchor="middle">0</text><rect x="674" y="105" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="699" y="137" font-size="22" fill="#172b4d" text-anchor="middle">−1</text><rect x="620" y="159" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="645" y="191" font-size="22" fill="#172b4d" text-anchor="middle">−1</text><rect x="674" y="159" width="50" height="50" rx="5" fill="#e0f2fe" stroke="#94a3b8"/><text x="699" y="191" font-size="22" fill="#172b4d" text-anchor="middle">1</text><path d="M410,157 L595,157" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="502.5" y="148.0" font-size="16" fill="#172b4d" text-anchor="middle">逐项乘，再相加</text><text x="30" y="315" font-size="20" fill="#172b4d" text-anchor="start">左上窗口：1×1 + 2×0 + 0×0 + 1×(−1) = 0</text><text x=