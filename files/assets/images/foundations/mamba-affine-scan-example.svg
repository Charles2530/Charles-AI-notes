<svg xmlns="http://www.w3.org/2000/svg" width="840" height="405" viewBox="0 0 840 405" role="img" aria-labelledby="title desc"><title id="title">递推与 scan 算的是同一个状态</title><desc id="desc">按时间递推的仿射变换可以结合，但不能任意交换顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">递推与 scan 算的是同一个状态</text><rect x="24" y="95" width="170" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="109.0" y="124" font-size="18" fill="#172b4d" text-anchor="middle">h₀ = 0</text><rect x="215" y="95" width="170" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="300.0" y="124" font-size="18" fill="#172b4d" text-anchor="middle">h₁ = 2</text><text x="300.0" y="149" font-size="18" fill="#172b4d" text-anchor="middle">0.5 × 0 + 2</text><rect x="415" y="95" width="170" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="500.0" y="124" font-size="18" fill="#172b4d" text-anchor="middle">h₂ = 1</text><text x="500.0" y="149" font-size="18" fill="#172b4d" text-anchor="middle">0.5 × 2 + 0</text><rect x="615" y="95" width="170" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="700.0" y="124" font-size="18" fill="#172b4d" text-anchor="middle">h₃ = 4.5</text><text x="700.0" y="149" font-size="18" fill="#172b4d" text-anchor="middle">0.5 × 1 + 4</text><path d="M194,135 L214,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M385,135 L405,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M585,135 L605,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="235" width="320" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="200.0" y="264" font-size="18" fill="#172b4d" text-anchor="middle">前两步合成</text><text x="200.0" y="289" font-size="18" fill="#172b4d" text-anchor="middle">h₂ = 0.25 h₀ + 1</text><rect x="450" y="235" width="340" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="620.0" y="264" font-size="18" fill="#172b4d" text-anchor="middle">再与第三步合成</text><text x="620.0" y="289" font-size="18" fill="#172b4d" text-anchor="middle">h₃ = 0.125 h₀ + 4.5</text><path d="M360,277 L450,277" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="370" font-size="18" fill="#172b4d" text-anchor="start">结合律允许改变分组；输入的先后顺序仍必须保留。</text></g></svg>