<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="title desc"><title id="title">四个 token 如何分发，再回到原位置</title><desc id="desc">Top-1按概率选择专家，本算例保留所选概率作为门控，不重新归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">四个 token 如何分发，再回到原位置</text><rect x="25" y="90" width="190" height="140" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="120.0" y="119" font-size="18" fill="#172b4d" text-anchor="middle">原始 token 顺序</text><text x="120.0" y="144" font-size="18" fill="#172b4d" text-anchor="middle">t₀ = 1，t₁ = 2</text><text x="120.0" y="169" font-size="18" fill="#172b4d" text-anchor="middle">t₂ = 3，t₃ = 4</text><text x="120.0" y="194" font-size="18" fill="#172b4d" text-anchor="middle">原位置必须保留</text><rect x="300" y="75" width="240" height="100" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="420.0" y="104" font-size="18" fill="#172b4d" text-anchor="middle">专家 0：E₀(x) = 2x</text><text x="420.0" y="129" font-size="18" fill="#172b4d" text-anchor="middle">接收 t₀、t₂</text><text x="420.0" y="154" font-size="18" fill="#172b4d" text-anchor="middle">局部输出 2、6</text><rect x="300" y="230" width="240" height="100" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="420.0" y="259" font-size="18" fill="#172b4d" text-anchor="middle">专家 1：E₁(x) = −x</text><text x="420.0" y="284" font-size="18" fill="#172b4d" text-anchor="middle">接收 t₁、t₃</text><text x="420.0" y="309" font-size="18" fill="#172b4d" text-anchor="middle">局部输出 −2、−4</text><path d="M215,125 L300,125" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="257.5" y="116.0" font-size="16" fill="#172b4d" text-anchor="middle">0.8 / 0.6</text><path d="M215,200 L300,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="257.5" y="223.5" font-size="16" fill="#172b4d" text-anchor="middle">0.7 / 0.9</text><rect x="620" y="130" width="195" height="150" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="717.5" y="159" font-size="18" fill="#172b4d" text-anchor="middle">乘所选门控并归位</text><text x="717.5" y="184" font-size="18" fill="#172b4d" text-anchor="middle">t₀ → 1.6</text><text x="717.5" y="209" font-size="18" fill="#172b4d" text-anchor="middle">t₁ → −1.4</text><text x="717.5" y="234" font-size="18" fill="#172b4d" text-anchor="middle">t₂ → 3.6</text><text x="717.5" y="259" font-size="18" fill="#172b4d" text-anchor="middle">t₃ → −3.6</text><path d="M540,125 L620,155" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M540,280 L620,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="382" font-size="18" fill="#172b4d" text-anchor="start">dispatch 按专家重排；combine 按 token 原位置写回。</text><text x="30" y="418" font-size="17" fill="#172b4d" text-anchor="start">top-1 选择是离散的，保留下来的门控概率仍有可微路径。</text></g></svg>