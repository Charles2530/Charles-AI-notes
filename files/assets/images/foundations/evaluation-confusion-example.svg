<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="title desc"><title id="title">85% 准确率中，仍藏着一半漏报</title><desc id="desc">人工介入算正类。真实需要介入20条，预测介入15条，两者交集10条。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">85% 准确率中，仍藏着一半漏报</text><text x="310" y="91" font-size="19" fill="#172b4d" text-anchor="start">预测需要介入</text><text x="565" y="91" font-size="19" fill="#172b4d" text-anchor="start">预测无需介入</text><text x="25" y="150" font-size="18" fill="#172b4d" text-anchor="start">实际需要介入</text><text x="25" y="258" font-size="18" fill="#172b4d" text-anchor="start">实际无需介入</text><rect x="290" y="110" width="225" height="90" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="402.5" y="139" font-size="18" fill="#172b4d" text-anchor="middle">TP = 10</text><text x="402.5" y="164" font-size="18" fill="#172b4d" text-anchor="middle">正确报警</text><rect x="555" y="110" width="225" height="90" rx="10" fill="#fee2e2" stroke="#94a3b8"/><text x="667.5" y="139" font-size="18" fill="#172b4d" text-anchor="middle">FN = 10</text><text x="667.5" y="164" font-size="18" fill="#172b4d" text-anchor="middle">漏掉的正类</text><rect x="290" y="220" width="225" height="90" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="402.5" y="249" font-size="18" fill="#172b4d" text-anchor="middle">FP = 5</text><text x="402.5" y="274" font-size="18" fill="#172b4d" text-anchor="middle">误报</text><rect x="555" y="220" width="225" height="90" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="667.5" y="249" font-size="18" fill="#172b4d" text-anchor="middle">TN = 75</text><text x="667.5" y="274" font-size="18" fill="#172b4d" text-anchor="middle">正确放行</text><text x="30" y="358" font-size="20" fill="#172b4d" text-anchor="start">Precision 看预测正类这一列：10 / (10 + 5) = 2/3</text><text x="30" y="395" font-size="20" fill="#172b4d" text-anchor="start">Recall 看真实正类这一行：10 / (10 + 10) = 1/2</text></g></svg>