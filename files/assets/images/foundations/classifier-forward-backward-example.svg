<svg xmlns="http://www.w3.org/2000/svg" width="840" height="395" viewBox="0 0 840 395" role="img" aria-labelledby="title desc"><title id="title">一次二分类前向与参数更新</title><desc id="desc">前向从输入算概率和损失，反向用p减y得到参数导数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">一次二分类前向与参数更新</text><rect x="25" y="85" width="215" height="100" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="132.5" y="114" font-size="18" fill="#172b4d" text-anchor="middle">输入 x = (1, 2)</text><text x="132.5" y="139" font-size="18" fill="#172b4d" text-anchor="middle">w = (0.2, −0.1)</text><text x="132.5" y="164" font-size="18" fill="#172b4d" text-anchor="middle">b = 0</text><rect x="320" y="85" width="195" height="100" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="417.5" y="114" font-size="18" fill="#172b4d" text-anchor="middle">z = xw + b = 0</text><text x="417.5" y="139" font-size="18" fill="#172b4d" text-anchor="middle">p = sigmoid(z)</text><text x="417.5" y="164" font-size="18" fill="#172b4d" text-anchor="middle">p = 0.5</text><rect x="595" y="85" width="215" height="100" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="702.5" y="114" font-size="18" fill="#172b4d" text-anchor="middle">真实标签 y = 1</text><text x="702.5" y="139" font-size="18" fill="#172b4d" text-anchor="middle">ℓ = −log p</text><text x="702.5" y="164" font-size="18" fill="#172b4d" text-anchor="middle">ℓ ≈ 0.693147</text><path d="M240,135 L320,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M515,135 L595,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="255" width="490" height="85" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="565.0" y="284" font-size="18" fill="#172b4d" text-anchor="middle">反向 ∂ℓ/∂z = p − y = −0.5</text><text x="565.0" y="309" font-size="18" fill="#172b4d" text-anchor="middle">∇wℓ = (−0.5, −1)，∂ℓ/∂b = −0.5</text><path d="M705,185 L705,255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="255" width="215" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="132.5" y="284" font-size="18" fill="#172b4d" text-anchor="middle">学习率 0.1 更新后</text><text x="132.5" y="309" font-size="18" fill="#172b4d" text-anchor="middle">w = (0.25, 0)</text><text x="132.5" y="334" font-size="18" fill="#172b4d" text-anchor="middle">b = 0.05</text><path d="M320,296 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></g></svg>