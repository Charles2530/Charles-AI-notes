<svg xmlns="http://www.w3.org/2000/svg" width="840" height="395" viewBox="0 0 840 395" role="img" aria-labelledby="title desc"><title id="title">残差连接上，Norm 放在哪里</title><desc id="desc">Pre-Norm主路直接跨过子层，Post-Norm在相加后继续经过归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">残差连接上，Norm 放在哪里</text><text x="25" y="80" font-size="21" fill="#172b4d" text-anchor="start">Pre-Norm</text><text x="450" y="80" font-size="21" fill="#172b4d" text-anchor="start">Post-Norm</text><rect x="25" y="130" width="80" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="65.0" y="159" font-size="18" fill="#172b4d" text-anchor="middle">x</text><rect x="160" y="130" width="145" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="232.5" y="159" font-size="18" fill="#172b4d" text-anchor="middle">F(Norm(x))</text><rect x="340" y="130" width="55" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="367.5" y="159" font-size="18" fill="#172b4d" text-anchor="middle">+</text><path d="M105,162 L160,162" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M305,162 L340,162" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M65,130 V100 H367 V130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="445" y="130" width="80" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="485.0" y="159" font-size="18" fill="#172b4d" text-anchor="middle">x</text><rect x="580" y="130" width="145" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="652.5" y="159" font-size="18" fill="#172b4d" text-anchor="middle">F(x)</text><rect x="760" y="130" width="55" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="787.5" y="159" font-size="18" fill="#172b4d" text-anchor="middle">+</text><path d="M525,162 L580,162" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M725,162 L760,162" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M485,130 V100 H787 V130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="260" width="125" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="342.5" y="289" font-size="18" fill="#172b4d" text-anchor="middle">输出</text><path d="M367,195 L342,260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="260" width="145" height="65" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="722.5" y="289" font-size="18" fill="#172b4d" text-anchor="middle">Norm 后输出</text><path d="M787,195 L722,260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="370" font-size="18" fill="#172b4d" text-anchor="start">差别在整条计算路径及其导数，不能只看模块名字是否齐全。</text></g></svg>