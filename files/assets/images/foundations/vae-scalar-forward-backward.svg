<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="title desc"><title id="title">同一次 VAE 前向，产生两条梯度路径</title><desc id="desc">重建项经重参数化采样返回编码器，KL项直接约束均值和尺度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">同一次 VAE 前向，产生两条梯度路径</text><rect x="24" y="80" width="166" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="107.0" y="109" font-size="18" fill="#172b4d" text-anchor="middle">编码器输出</text><text x="107.0" y="134" font-size="18" fill="#172b4d" text-anchor="middle">μ = 1，σ = 0.5</text><rect x="24" y="240" width="166" height="65" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="107.0" y="269" font-size="18" fill="#172b4d" text-anchor="middle">固定噪声 ε = −0.4</text><rect x="255" y="80" width="190" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="350.0" y="109" font-size="18" fill="#172b4d" text-anchor="middle">z = μ + σε</text><text x="350.0" y="134" font-size="18" fill="#172b4d" text-anchor="middle">z = 0.8</text><path d="M190,120 L255,120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M190,268 L290,160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="80" width="294" height="80" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="657.0" y="109" font-size="18" fill="#172b4d" text-anchor="middle">解码器均值 wz = 1.6</text><text x="657.0" y="134" font-size="18" fill="#172b4d" text-anchor="middle">w = 2，观测 x = 2</text><path d="M445,120 L510,120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="225" width="294" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="657.0" y="254" font-size="18" fill="#172b4d" text-anchor="middle">重建项 ½(x − wz)²</text><text x="657.0" y="279" font-size="18" fill="#172b4d" text-anchor="middle">0.08，∂Lrec/∂z = −0.8</text><path d="M657,160 L657,225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="225" width="190" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="350.0" y="254" font-size="18" fill="#172b4d" text-anchor="middle">KL(q || p)</text><text x="350.0" y="279" font-size="18" fill="#172b4d" text-anchor="middle">0.818147</text><path d="M142,160 L255,245" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="365" font-size="18" fill="#172b4d" text-anchor="start">∂L/∂μ = −0.8 + 1 = 0.2</text><text x="28" y="398" font-size="18" fill="#172b4d" text-anchor="start">∂L/∂σ = (−0.8) × (−0.4) + (0.5 − 1/0.5) = −1.18</text><text x="28" y="437" font-size="17" fill="#172b4d" text-anchor="start">固定 ε 后先核对链式法则，再对新噪声样本取平均。</text></g></svg>