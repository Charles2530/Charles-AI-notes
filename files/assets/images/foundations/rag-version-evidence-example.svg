<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="title desc"><title id="title">规则版本错了，后续计算再精确也会答错</title><desc id="desc">同一订单九天，旧规则十四天与当前规则七天导致相反答案。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="840" height="100%" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start">规则版本错了，后续计算再精确也会答错</text><rect x="25" y="90" width="195" height="85" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="122.5" y="119" font-size="18" fill="#172b4d" text-anchor="middle">普通商品，已签收 9 天</text><text x="122.5" y="144" font-size="18" fill="#172b4d" text-anchor="middle">适用当前规则</text><rect x="330" y="70" width="225" height="85" rx="10" fill="#fee2e2" stroke="#94a3b8"/><text x="442.5" y="99" font-size="18" fill="#172b4d" text-anchor="middle">旧文档 A：14 天</text><text x="442.5" y="124" font-size="18" fill="#172b4d" text-anchor="middle">版本过滤后排除</text><rect x="330" y="220" width="225" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="442.5" y="249" font-size="18" fill="#172b4d" text-anchor="middle">当前文档 B：7 天</text><text x="442.5" y="274" font-size="18" fill="#172b4d" text-anchor="middle">保留适用范围与版本</text><path d="M220,115 L330,110" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M220,150 L330,260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="220" width="180" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="725.0" y="249" font-size="18" fill="#172b4d" text-anchor="middle">9 &gt; 7</text><text x="725.0" y="274" font-size="18" fill="#172b4d" text-anchor="middle">普通规则下不可退</text><path d="M555,262 L635,262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="357" font-size="18" fill="#172b4d" text-anchor="start">召回找到候选 → 过滤适用版本 → 保留条件 → 计算并引用 B</text></g></svg>