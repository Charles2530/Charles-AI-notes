<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-label="按样本数均分，不一定按计算量均分">
<title>按样本数均分，不一定按计算量均分</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687e"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="36" y="46" font-size="27" font-weight="700" fill="#172f48">按样本数均分，不一定按计算量均分</text><text x="36" y="78" font-size="17" fill="#50677c">讲解示意 · H3 公开的是理解/生成工作负载分离与联合均衡；具体调度算法未披露</text>
<text x="40" y="125" font-size="20" fill="#233c54" font-weight="400">两个样本可以有相同输出长度，却有很不一样的参考处理成本。</text>
<text x="40" y="203" font-size="20" fill="#233c54" font-weight="400">少量参考</text>
<rect x="190" y="170" width="100" height="50" rx="6" fill="#b8d5f3"/>
<rect x="290" y="170" width="310" height="50" rx="6" fill="#afd7c0"/>
<text x="198" y="202" font-size="18" fill="#233c54" font-weight="400">理解</text>
<text x="302" y="202" font-size="18" fill="#233c54" font-weight="400">生成</text>
<text x="40" y="288" font-size="20" fill="#233c54" font-weight="400">多段参考</text>
<rect x="190" y="255" width="400" height="50" rx="6" fill="#b8d5f3"/>
<rect x="590" y="255" width="310" height="50" rx="6" fill="#afd7c0"/>
<text x="198" y="287" font-size="18" fill="#233c54" font-weight="400">理解</text>
<text x="602" y="287" font-size="18" fill="#233c54" font-weight="400">生成</text>
<text x="40" y="345" font-size="17" fill="#50677c" font-weight="400">条长仅表示假设的工作量差异，无实测数值，也不表示严格串行执行。</text>
<rect x="35" y="390" width="490" height="160" rx="13" fill="#eaf3ff" stroke="#b7c9d8" stroke-width="2"/>
<text x="55" y="424" font-size="21" fill="#233c54" font-weight="600">单个样本内</text>
<text x="55" y="456" font-size="18" fill="#233c54" font-weight="400">理解与生成对应不同工作负载</text>
<text x="55" y="483" font-size="18" fill="#233c54" font-weight="400">分别优化其硬件利用率</text>
<text x="55" y="510" font-size="18" fill="#233c54" font-weight="400">仍需共同完成该样本的任务</text>
<rect x="595" y="390" width="490" height="160" rx="13" fill="#e9f5ef" stroke="#b7c9d8" stroke-width="2"/>
<text x="615" y="424" font-size="21" fill="#233c54" font-weight="600">多个样本之间</text>
<text x="615" y="456" font-size="18" fill="#233c54" font-weight="400">参考数量与长度不同</text>
<text x="615" y="483" font-size="18" fill="#233c54" font-weight="400">分配时还要平衡总工作量</text>
<text x="615" y="510" font-size="18" fill="#233c54" font-weight="400">否则慢任务造成等待</text>
<path d="M530,470 L590,470" stroke="#52687e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="600" font-size="20" fill="#233c54" font-weight="400">官方结果为端到端训练吞吐接近 +30%，不等于单次视频生成延迟 −30%。</text>
</g></svg>
