<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-label="同一组参考，需要给出不同的使用关系">
<title>同一组参考，需要给出不同的使用关系</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687e"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="36" y="46" font-size="27" font-weight="700" fill="#172f48">同一组参考，需要给出不同的使用关系</text><text x="36" y="78" font-size="17" fill="#50677c">讲解示意 · 改编自官方 Video 1 / Image 2 / Audio 3 示例，不表示 H3 内部计算图</text>
<rect x="35" y="115" width="290" height="110" rx="13" fill="#fff" stroke="#b7c9d8" stroke-width="2"/>
<text x="55" y="149" font-size="21" fill="#233c54" font-weight="600">Video 1</text>
<text x="55" y="181" font-size="18" fill="#233c54" font-weight="400">参考镜头运动</text>
<text x="55" y="208" font-size="18" fill="#233c54" font-weight="400">不自动继承画面中的人物</text>
<rect x="35" y="255" width="290" height="110" rx="13" fill="#fff" stroke="#b7c9d8" stroke-width="2"/>
<text x="55" y="289" font-size="21" fill="#233c54" font-weight="600">Image 2</text>
<text x="55" y="321" font-size="18" fill="#233c54" font-weight="400">参考人物身份与外观</text>
<text x="55" y="348" font-size="18" fill="#233c54" font-weight="400">不自动继承静止姿态</text>
<rect x="35" y="395" width="290" height="110" rx="13" fill="#fff" stroke="#b7c9d8" stroke-width="2"/>
<text x="55" y="429" font-size="21" fill="#233c54" font-weight="600">Audio 3</text>
<text x="55" y="461" font-size="18" fill="#233c54" font-weight="400">参考演唱与人声</text>
<text x="55" y="488" font-size="18" fill="#233c54" font-weight="400">与目标动作建立时间关系</text>
<rect x="410" y="210" width="300" height="200" rx="13" fill="#eaf3ff" stroke="#7da7d0" stroke-width="2"/>
<text x="430" y="244" font-size="21" fill="#233c54" font-weight="600">语言说明素材的角色</text>
<text x="430" y="276" font-size="18" fill="#233c54" font-weight="400">从哪个输入取什么</text>
<text x="430" y="303" font-size="18" fill="#233c54" font-weight="400">哪些属性需要保留</text>
<text x="430" y="330" font-size="18" fill="#233c54" font-weight="400">哪些属性需要改变</text>
<text x="430" y="357" font-size="18" fill="#233c54" font-weight="400">输入之间怎样配合</text>
<path d="M325,170 L405,310" stroke="#52687e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M325,310 L405,310" stroke="#52687e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M325,450 L405,310" stroke="#52687e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="230" width="295" height="155" rx="13" fill="#e9f5ef" stroke="#7cb39c" stroke-width="2"/>
<text x="810" y="264" font-size="21" fill="#233c54" font-weight="600">目标音视频</text>
<text x="810" y="296" font-size="18" fill="#233c54" font-weight="400">指定人物演唱</text>
<text x="810" y="323" font-size="18" fill="#233c54" font-weight="400">沿用指定镜头运动</text>
<text x="810" y="350" font-size="18" fill="#233c54" font-weight="400">人声服从音频参考</text>
<path d="M710,310 L785,310" stroke="#52687e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="35" y="555" width="1050" height="78" rx="13" fill="#fff4e8" stroke="#d6b48b" stroke-width="2"/>
<text x="55" y="589" font-size="21" fill="#233c54" font-weight="600">检查重点</text>
<text x="55" y="621" font-size="18" fill="#233c54" font-weight="400">“都出现了”不够；人物、镜头和声音必须绑定到正确来源。</text>
</g></svg>
