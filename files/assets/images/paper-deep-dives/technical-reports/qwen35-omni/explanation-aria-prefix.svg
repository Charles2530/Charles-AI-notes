<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img"><title>ARIA 约束每一个前缀，仍允许不同交织顺序</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687e"/></marker></defs><rect width="100%" height="100%" fill="#f7fafc"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="36" y="46" font-size="27" font-weight="700" fill="#172f48">ARIA 约束每一个前缀，仍允许不同交织顺序</text><text x="36" y="80" font-size="17" fill="#50677c">说明性例子 · 全句 4 个文字 token、8 个语音 token；数量为讲解假设，方块不代表等长时间</text>
<text x="36" y="126" font-size="23" fill="#233c54" font-weight="600">整体比例 S/T = 2，所以任一前缀需要满足 Sₖ ≤ 2Tₖ。</text>
