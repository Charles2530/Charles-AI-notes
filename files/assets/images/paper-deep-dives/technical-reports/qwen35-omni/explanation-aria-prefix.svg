<text x="510" y="214" font-size="24" fill="#233c54" font-weight="600">S</text>
<rect x="558" y="180" width="58" height="52" rx="8" fill="#c8e6d8" stroke="#617b94"/>
<text x="578" y="214" font-size="24" fill="#233c54" font-weight="600">S</text>
<rect x="626" y="180" width="58" height="52" rx="8" fill="#c9dcf6" stroke="#617b94"/>
<text x="646" y="214" font-size="24" fill="#233c54" font-weight="600">T</text>
<rect x="694" y="180" width="58" height="52" rx="8" fill="#c8e6d8" stroke="#617b94"/>
<text x="714" y="214" font-size="24" fill="#233c54" font-weight="600">S</text>
<rect x="762" y="180" width="58" height="52" rx="8" fill="#c8e6d8" stroke="#617b94"/>
<text x="782" y="214" font-size="24" fill="#233c54" font-weight="600">S</text>
<rect x="830" y="180" width="58" height="52" rx="8" fill="#c9dcf6" stroke="#617b94"/>
<text x="850" y="214" font-size="24" fill="#233c54" font-weight="600">T</text>
<rect x="898" y="180" width="58" height="52" rx="8" fill="#c8e6d8" stroke="#617b94"/>
<text x="918" y="214" font-size="24" fill="#233c54" font-weight="600">S</text>
<rect x="966" y="180" width="58" height="52" rx="8" fill="#c8e6d8" stroke="#617b94"/>
<text x="986" y="214" font-size="24" fill="#233c54" font-weight="600">S</text>
<text x="218" y="265" font-size="19" fill="#233c54" font-weight="400">T S S 后，Tₖ=1、Sₖ=2；继续放 T，文字预算随之增加。</text>
<text x="36" y="333" font-size="21" fill="#233c54" font-weight="400">合法顺序 B</text>
