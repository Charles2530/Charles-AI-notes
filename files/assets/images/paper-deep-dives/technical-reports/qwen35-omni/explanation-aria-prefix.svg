<text x="218" y="385" font-size="19" fill="#233c54" font-weight="400">也可以先放更多文字。相同总比例不决定唯一顺序，更不决定逐词时间戳。</text>
<text x="36" y="453" font-size="21" fill="#233c54" font-weight="400">超前的前缀</text>
<rect x="218" y="420" width="58" height="52" rx="8" fill="#c9dcf6" stroke="#617b94"/>
<text x="238" y="454" font-size="24" fill="#233c54" font-weight="600">T</text>
