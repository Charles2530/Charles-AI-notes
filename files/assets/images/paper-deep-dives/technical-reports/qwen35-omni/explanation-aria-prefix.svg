<rect x="414" y="412" width="74" height="68" rx="10" fill="none" stroke="#c55243" stroke-width="3"/>
<text x="520" y="442" font-size="21" fill="#ad4338" font-weight="600">第 4 个位置已有 3 个 S、1 个 T</text>
<text x="520" y="474" font-size="20" fill="#ad4338" font-weight="400">3 &gt; 2 × 1，超过这一前缀的上限</text>
<rect x="36" y="538" width="1048" height="88" rx="12" fill="#fff4e8" stroke="#b7c9d8" stroke-width="2"/>
<text x="54" y="570" font-size="21" fill="#233c54" font-weight="600">读图时要分开两件事</text>
<text x="54" y="602" font-size="18" fill="#233c54" font-weight="400">“语音不要超过累计文字预算”是已公开规则；具体帧率、比例估计和部署调度没有由此确定。</text>
