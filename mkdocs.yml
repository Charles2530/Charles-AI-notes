site_name: Charles AI notes
site_description: 面向扩散模型、VLM、VLA、量化、训练、推理、强化学习、世界模型与具身智能的中文知识库
docs_dir: files
exclude_docs: |
  roadmap/**
not_in_nav: |
  **/*.md
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
hooks:
  - hooks/paper_deep_dives_sort.py
extra_javascript:
  - assets/javascripts/search-fallback.js
  - assets/javascripts/term-tooltips.js
  - assets/javascripts/reading-controls.js
  - assets/javascripts/image-lightbox.js
  - assets/javascripts/vendor/mermaid.min.js
  - assets/javascripts/mermaid.js
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - assets/stylesheets/extra.css
nav:
  - 首页: index.md
  - 基础概念:
      - Transformer 输入与注意力: foundations/transformer-attention-and-tokenization.md
      - 张量、Shape 与计算图: foundations/tensors-shapes-and-computation-graphs.md
      - 线性层、MLP 与 GEMM: foundations/linear-layers-mlp-and-gemm.md
      - 优化与训练入门: foundations/optimization-and-training-basics.md
      - 概率与潜变量模型: foundations/probability-latent-variables-and-generative-models.md
      - 数据与数据集基础: foundations/data-and-dataset-basics.md
      - 生成与解码基础: foundations/generation-and-decoding-basics.md
      - 位置编码与 Mask: foundations/positional-encoding-masks-and-context.md
      - MoE 与大模型架构: foundations/moe-and-large-model-architecture-basics.md
  - 训练与推理系统:
      - 模型训练从零入门: training/beginner-model-training-primer.md
      - 目标函数、优化器与 LR 日程: training/objectives-optimizers-and-schedules.md
      - 预训练、微调与对齐: training/pretraining-finetuning-alignment.md
      - 分布式训练与 Checkpoint: training/distributed-training-and-checkpointing.md
      - Megatron / DeepSpeed: training/megatron-lm-deepspeed-and-open-training-stacks.md
      - 低比特训练与数值格式: training/low-bit-training-and-numerics.md
      - 推理运行时: inference/serving-runtimes-vllm-sglang-and-tensorrt-llm.md
